<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrollGui</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='10' y='70' font-size='70' fill='white'>T</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0d0d11;
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .gui-container {
            width: 96%;
            max-width: 780px;
            height: 90vh;
            max-height: 660px;
            background: rgba(12, 12, 18, 0.88);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 22px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0;
        }
        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff, #b0b0b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }
        .tabs {
            display: flex;
            gap: 4px;
        }
        .tab {
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            background: transparent;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .tab.active {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.06);
        }
        .tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
        }
        .page {
            display: none;
            flex: 1;
            overflow: hidden;
            padding: 12px 14px 14px 14px;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }
        .download-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .download-card .icon {
            font-size: 64px;
            opacity: 0.6;
        }
        .download-card h1 {
            font-size: 38px;
            font-weight: 300;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff, #b0b0b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .download-card .sub {
            color: #666;
            font-size: 14px;
            margin-top: -8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8a8a8a, #4a4a4a);
            border: none;
            padding: 14px 48px;
            border-radius: 60px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 28px rgba(255, 255, 255, 0.1);
            letter-spacing: 0.3px;
        }
        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 36px rgba(255, 255, 255, 0.2);
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        .functions-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            margin-top: 4px;
        }
        .functions-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .functions-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .functions-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            padding-bottom: 10px;
        }
        .func-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 16px 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: #bbb;
            transition: 0.2s;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }
        .func-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        .func-card .badge {
            display: block;
            font-size: 9px;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 40px;
            color: #cccccc;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #18181f;
            border-radius: 24px;
            max-width: 480px;
            width: 92%;
            padding: 30px 26px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .modal-box p {
            line-height: 1.6;
            color: #bbb;
            font-size: 14px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .modal-box p::-webkit-scrollbar {
            width: 3px;
        }
        .modal-box p::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        .modal-close {
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 28px;
            border-radius: 40px;
            color: #999;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #1e3a2a;
            padding: 12px 26px;
            border-radius: 60px;
            color: #8bc34a;
            font-weight: 500;
            font-size: 14px;
            opacity: 0;
            transform: translateY(12px);
            transition: 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            border: 1px solid rgba(139, 195, 74, 0.08);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        @media (max-width: 600px) {
            .gui-container {
                width: 98%;
                height: 95vh;
                max-height: none;
                border-radius: 16px;
            }
            .navbar {
                padding: 10px 14px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .logo {
                font-size: 18px;
            }
            .tab {
                font-size: 12px;
                padding: 4px 12px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 6px;
            }
            .func-card {
                padding: 12px 6px;
                font-size: 11px;
            }
            .download-card h1 {
                font-size: 28px;
            }
            .btn-primary {
                padding: 12px 32px;
                font-size: 15px;
            }
            .modal-box {
                padding: 22px 16px;
            }
            .modal-box h2 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="gui-container">
        <div class="navbar">
            <span class="logo">TrollGui</span>
            <div class="tabs">
                <div class="tab active" data-tab="downloads">Downloads</div>
                <div class="tab" data-tab="functions">Functions</div>
            </div>
        </div>
        <div id="page-downloads" class="page active">
            <div class="download-card">
                <div class="icon">𝓣</div>
                <h1>TrollGui</h1>
                <button class="btn-primary" id="copyScriptBtn">📋 Get TrollGui</button>
                <span class="sub">Obtenha o TrollGui</span>
            </div>
        </div>
        <div id="page-functions" class="page">
            <div class="functions-scroll" id="functionsScroll">
                <div class="grid" id="functionsGrid"></div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h2 id="modalTitle">Título</h2>
            <p id="modalText">Descrição...</p>
            <button class="modal-close" id="modalCloseBtn">Fechar</button>
        </div>
    </div>
    <div class="toast" id="toast">✅ Copiado!</div>
    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                s: 0.5 + Math.random() * 1.2,
                v: 0.3 + Math.random() * 1.0
            });
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            particles.forEach(p => {
                p.y += p.v * 0.3;
                if (p.y > canvas.height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.s * 0.5, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        const tabs = document.querySelectorAll('.tab');
        const pages = {
            downloads: document.getElementById('page-downloads'),
            functions: document.getElementById('page-functions')
        };
        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                const target = this.dataset.tab;
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                Object.keys(pages).forEach(key => {
                    pages[key].classList.toggle('active', key === target);
                });
            });
        });
        const scriptText = `loadstring(game:HttpGet("https://raw.githubusercontent.com/TrollGui/TrollGuiScript/refs/heads/main/TrollGui"))()`;
        const toast = document.getElementById('toast');
        document.getElementById('copyScriptBtn').addEventListener('click', function() {
            navigator.clipboard.writeText(scriptText).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2200);
            }).catch(() => {
                const area = document.createElement('textarea');
                area.value = scriptText;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2200);
            });
        });
        const functionsData = [{
            title: "TrollGui",
            text: "TrollGui é um script de GUI para Roblox. Possui diversos botões, cada um com uma função diferente. Para usar, clique em 'Get TrollGui' e execute o script no seu executor. Tecla R para minimizar, X para fechar. Segurar a tecla ALT irá liberar seu mouse."
        }, {
            title: "Player Tracker",
            text: "Selecione um jogador por nome ou display name. Veja a foto, rastreie o mais próximo ou aleatório. Com o jogador selecionado, ative funções como ESP, Spectate, Loop Teleport e mais."
        }, {
            title: "Speed",
            text: "Altere a velocidade do seu personagem. Digite um valor na caixa e clique em 'Set Speed'."
        }, {
            title: "ESP Player / ESP All",
            text: "ESP Player: destaca o jogador selecionado. ESP All: destaca todos os jogadores do servidor."
        }, {
            title: "Spectate Player",
            text: "Especte o jogador selecionado. Ative/desative para seguir a câmera."
        }, {
            title: "Loop Teleport & Teleport",
            text: "Loop Teleport: teleporta você atrás do jogador em loop. Teleport to Player: teleporta uma única vez."
        }, {
            title: "Posição (X,Y,Z)",
            text: "Teleporte para coordenadas específicas ou pegue sua posição atual."
        }, {
            title: "First Person",
            text: "Alterna para visão em primeira pessoa."
        }, {
            title: "Fake Death 2",
            text: "Simula morte, mas você pode voar enquanto 'cai'."
        }, {
            title: "QuietServer",
            text: "Teleporta para o servidor mais vazio do jogo atual."
        }, {
            title: "Coordinates",
            text: "Abre um frame com suas coordenadas em tempo real. Copie no formato X: 123.45 | Y: 67.89 | Z: -32.10"
        }, {
            title: "Click = Block",
            text: "Clique no chão para criar blocos(E pode aumentar eles). Use Delete Part (X) para remover."
        }, {
            title: "WalkAllow",
            text: "Permite andar mesmo se o jogo bloquear movimento."
        }, {
            title: "Noclip",
            text: "Atravesse paredes e partes. Combine com CFrameFly para voar."
        }, {
            title: "LoudServer",
            text: "Teleporta para o servidor mais cheio do jogo atual."
        }, {
            title: "Invisible Fling",
            text: "Fling invisível muito forte. Recomendado com Loop Teleport."
        }, {
            title: "SpinFling",
            text: "Gira seu personagem rapidamente. Pode trollar amigos."
        }, {
            title: "Delete Part (X)",
            text: "Pressione X em uma parte para deletá-la (apenas local)."
        }, {
            title: "Fake Death",
            text: "Deita no chão. Bom para PvP, inimigos não acertam."
        }, {
            title: "ProximityPrompt Insta",
            text: "Todos os prompts do jogo ficam instantâneos e ativam à distância e através das paredes."
        }, {
            title: "ClickTp",
            text: "Clique em qualquer lugar para teleportar."
        }, {
            title: "Humanoid/GUI",
            text: "Deixa eu jogador totalmente bugado(Aparece a Hitbox dele, e o que tem escondido do seu jogador visivel, e TODAS as GUIS do jogo serão visiveis)."
        }, {
            title: "Unblock all",
            text: "Desbloqueia chat, emotes, backpack, leaderboard e mais."
        }, {
            title: "Kill",
            text: "Mata seu personagem instantaneamente."
        }, {
            title: "Audio Viewer",
            text: "Visualiza todos os sons do jogo."
        }, {
            title: "CFrameFly",
            text: "Voe em CFrame (não detectado como voo pelos anticheats)."
        }, {
            title: "float",
            text: "Flutua no ar em loop."
        }, {
            title: "WalkFling",
            text: "Abre uma GUI de Fling, Quando ativo, encoste em jogadores para arremessá-los."
        }, {
            title: "Freecam",
            text: "Libera a câmera para voar livremente."
        }, {
            title: "Egor Mode",
            text: "Animações aceleradas."
        }, {
            title: "Infinite Jump",
            text: "Pule quantas vezes quiser no ar."
        }, {
            title: "Dex",
            text: "Abre o Dex Explorer (visualizar arquivos do jogo)."
        }, {
            title: "Rejoin",
            text: "Reentra no mesmo jogo."
        }, {
            title: "Freeze Mode",
            text: "Um FAKE LAG, no caso animação de andar parado."
        }, {
            title: "FullBright",
            text: "Clareia o jogo e remove o FOG."
        }, {
            title: "Places Viewer",
            text: "Mostra todas as sub-places do jogo atual."
        }, {
            title: "Beta Mode",
            text: "Animações lentas."
        }, {
            title: "GodMode",
            text: "Você não morre para KillBrick em jogos como parkour(por que usa CanTouch = false)."
        }, {
            title: "Underground",
            text: "Te esconde debaixo do mapa."
        }, {
            title: "ReviveFree",
            text: "Tenta reviver automaticamente usando remotes."
        }, {
            title: "Word Searcher",
            text: "Usado em jogos como LAST LETTER ou algo do tipo para digitar sozinho o restante de uma palavra."
        }];
        const grid = document.getElementById('functionsGrid');
        functionsData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'func-card';
            card.innerHTML = `${item.title} <span class="badge">#${index + 1}</span>`;
            card.addEventListener('click', () => {
                document.getElementById('modalTitle').textContent = item.title;
                document.getElementById('modalText').textContent = item.text;
                document.getElementById('modalOverlay').classList.add('open');
            });
            grid.appendChild(card);
        });
        const modalOverlay = document.getElementById('modalOverlay');
        document.getElementById('modalCloseBtn').addEventListener('click', () => {
            modalOverlay.classList.remove('open');
        });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('open');
        });
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey) {
                const container = document.querySelector('.gui-container');
                container.style.transition = 'opacity 0.15s';
                container.style.opacity = container.style.opacity === '0.15' ? '1' : '0.15';
            }
        });
        setTimeout(() => {
            const scroll = document.getElementById('functionsScroll');
            if (scroll) scroll.scrollTop = 0;
        }, 50);
    </script>
</body>
</html>
